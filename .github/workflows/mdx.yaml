name: Validate MDX

on:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Get changed files
      run: |
        git diff-tree --name-only --no-commit-id -r HEAD...HEAD~1 -- '*.md' > changed-files.txt

    - name: Run mdx.js script
      env:
        FORCE_EXIT: 1
      run: |
        node ./script/mdxCompiler.js $(cat changed-files.txt)
      if: steps.get_changed_files.outputs.status == 0

    - name: Handle Errors
      run: |
        if [ $FORCE_EXIT -ne 0 ]; then
            echo "There were compilation errors"
            cat errors.txt
            exit 1
        else
            echo "All files were successfully compiled"
