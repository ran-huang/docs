name: Validate MDX

on:
  push:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Node.js
    - uses: actions/setup-node@v3
      with:
        node-version: 16

    - name: 'Get a list of changed markdown files to process'
      id: changed-files
      run: |
        CHANGED_FILES=$(git diff-tree --name-only --diff-filter 'AM' -r HEAD^1 HEAD -- "*.md" | sed -z "s/\n$//;s/\n/' '/g")
        echo "::set-output name=all_changed_files::${CHANGED_FILES}"

    - name: Validate MDX
      if: ${{ steps.changed-files.outputs.all_changed_files }}
      run: |
        npm install @mdx-js/mdx
        node ./scripts/mdxCompiler.js '${{ steps.changed-files.outputs.all_changed_files }}'
      env:
        FORCE_EXIT: 1

    - name: exit if error
      run: exit $?
